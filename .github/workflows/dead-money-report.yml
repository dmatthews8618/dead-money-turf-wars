name: Dead Money report and turn processing
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'competition/moves/**'
      - 'scripts/dead-money-*.mjs'
      - 'scripts/dead-money-*.cjs'
      - '.github/workflows/dead-money-report.yml'
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]
    paths:
      - 'competition/moves/**'
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: dead-money-match
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test automatic turn processing
        run: node --test scripts/dead-money-*.test.*
      - name: Validate and merge move-only submission
        id: submit
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await require('./scripts/dead-money-submit.cjs')({github, context, core});
            } catch (error) {
              require('node:fs').writeFileSync(process.env.RUNNER_TEMP + '/dead-money-process.log', String(error.message));
              core.setFailed(error.message);
            }
      - name: Refresh main after move merge
        if: steps.submit.outcome == 'success'
        run: git pull --ff-only origin main
      - name: Process both submitted moves
        id: process
        if: steps.submit.outcome != 'failure'
        continue-on-error: true
        run: node scripts/dead-money-auto.mjs > "$RUNNER_TEMP/dead-money-process.log" 2>&1
      - name: Publish live match status
        env:
          PROCESS_OUTCOME: ${{ steps.submit.outcome == 'failure' && 'failure' || steps.process.outcome }}
          PROCESS_LOG: ${{ runner.temp }}/dead-money-process.log
        run: node scripts/dead-money-public.mjs
      - name: Commit match and reports
        run: |
          git config user.name "dead-money-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add competition/match.json competition/REPORT.md competition/inbox/ competition/public.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Dead Money competition report [skip ci]"
            git push
          fi
      - name: Flag invalid submission
        if: steps.submit.outcome == 'failure' || steps.process.outcome == 'failure'
        run: |
          cat "$RUNNER_TEMP/dead-money-process.log"
          exit 1
